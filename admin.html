<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Bellora — Reservations</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<style>
  :root { --ivory:#F7F2E9; --cream:#EFE7D7; --gold:#A8895A; --espresso:#2B211A; --line:rgba(43,33,26,.14); }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 "Helvetica Neue",Arial,sans-serif; background:var(--ivory); color:var(--espresso); }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 28px; border-bottom:1px solid var(--line); background:var(--cream); }
  h1 { margin:0; font:500 22px Georgia,serif; letter-spacing:.2em; text-transform:uppercase; }
  main { padding:24px 28px; max-width:1200px; margin:auto; }
  button, select { font:inherit; padding:8px 14px; border:1px solid var(--espresso); background:transparent; color:var(--espresso); cursor:pointer; }
  button:hover { background:var(--espresso); color:var(--ivory); }
  input { font:inherit; padding:10px 12px; border:1px solid var(--line); background:#fff; width:min(360px,100%); }
  .login { max-width:420px; margin:12vh auto; text-align:center; display:grid; gap:14px; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center; }
  .count { margin-left:auto; color:#7a6a5a; }
  .wrap { overflow-x:auto; border:1px solid var(--line); background:#fff; }
  table { width:100%; border-collapse:collapse; min-width:820px; }
  th, td { text-align:left; padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); background:var(--cream); }
  .pill { display:inline-block; padding:2px 10px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; border:1px solid currentColor; }
  .new { color:#a8661f; } .confirmed { color:#2f7a4a; } .cancelled { color:#9b3b2f; }
  .notes { color:#7a6a5a; max-width:260px; }
  .err { color:#9b3b2f; min-height:1.4em; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div id="login" class="login">
  <h1>Bellora</h1>
  <p>Enter the admin token to view reservation requests.</p>
  <input id="token" type="password" placeholder="Admin token" autocomplete="current-password" />
  <button id="go">View reservations</button>
  <p class="err" id="loginErr"></p>
</div>

<div id="app" hidden>
  <header><h1>Reservations</h1><button id="logout">Sign out</button></header>
  <main>
    <div class="bar">
      <select id="filter">
        <option value="">All</option><option value="new">New</option>
        <option value="confirmed">Confirmed</option><option value="cancelled">Cancelled</option>
      </select>
      <button id="refresh">Refresh</button>
      <span class="count" id="count"></span>
    </div>
    <div class="wrap">
      <table>
        <thead><tr><th>Date</th><th>Time</th><th>Guests</th><th>Guest</th><th>Phone</th><th>Notes</th><th>Status</th><th>Received</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let token = sessionStorage.getItem("bellora_admin") || "";
  let all = [];

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const api = (url, opts = {}) => fetch(url, { ...opts, headers: { ...(opts.headers||{}), Authorization: "Bearer " + token, "Content-Type": "application/json" } });

  async function load() {
    const res = await api("/api/reservations");
    if (res.status === 401) { sessionStorage.removeItem("bellora_admin"); show(false); $("loginErr").textContent = "Wrong token (or ADMIN_TOKEN not set on the server)."; return; }
    const out = await res.json();
    all = out.reservations || [];
    show(true); render();
  }

  function render() {
    const f = $("filter").value;
    const list = f ? all.filter((r) => r.status === f) : all;
    $("count").textContent = list.length + " request" + (list.length === 1 ? "" : "s");
    $("rows").innerHTML = list.map((r) => `
      <tr>
        <td>${esc(r.date)}</td><td>${esc(r.time)}</td><td>${esc(r.guests)}</td>
        <td>${esc(r.name)}</td>
        <td><a href="tel:${esc(r.phone.replace(/[^\d+]/g,""))}">${esc(r.phone)}</a></td>
        <td class="notes">${esc(r.notes)}</td>
        <td><span class="pill ${esc(r.status)}">${esc(r.status)}</span><br />
          <select data-id="${esc(r.id)}">
            ${["new","confirmed","cancelled"].map((s) => `<option value="${s}" ${s===r.status?"selected":""}>${s}</option>`).join("")}
          </select></td>
        <td>${esc(new Date(r.createdAt).toLocaleString())}</td>
      </tr>`).join("") || '<tr><td colspan="8">No reservations yet.</td></tr>';
  }

  function show(authed) { $("login").hidden = authed; $("app").hidden = !authed; }

  $("go").onclick = () => { token = $("token").value.trim(); if (!token) return; sessionStorage.setItem("bellora_admin", token); $("loginErr").textContent = ""; load(); };
  $("token").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });
  $("logout").onclick = () => { sessionStorage.removeItem("bellora_admin"); token = ""; show(false); };
  $("refresh").onclick = load;
  $("filter").onchange = render;
  $("rows").addEventListener("change", async (e) => {
    const sel = e.target.closest("select[data-id]"); if (!sel) return;
    await api("/api/reservations/" + sel.dataset.id, { method: "PATCH", body: JSON.stringify({ status: sel.value }) });
    load();
  });

  if (token) load();
})();
</script>
</body>
</html>
